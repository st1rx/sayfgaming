<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages serves this for any missing path, so asset URLs must resolve
     from the site root. Change this to "/" if the site moves to its own domain. -->
<base href="/sayfgaming/">
<title>Sorry about your 404 — SAYF Gaming</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C4162B">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="./" aria-label="SAYF Gaming, home">
      <svg class="mark" aria-hidden="true"><use href="assets/icons.svg#mark"></use></svg>
      <span class="brand-text"><span class="brand-name">SAYF</span><span class="brand-sub">Gaming</span></span>
    </a>
    <div class="header-actions">
      <a class="btn btn-primary" href="https://discord.gg/YyyPNe7eGt">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#discord"></use></svg>
        <span class="label-long">Join the Discord</span><span class="label-short">Join</span>
      </a>
    </div>
  </div>
</header>

<main class="hero lost">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="wrap">
    <div class="hero-inner">
      <p class="mono eyebrow">404 &#183; Page not found</p>
      <h1 class="display">Sorry about<br>your 404</h1>
      <div class="tagline">
        <span class="rule" aria-hidden="true"></span>
        <span class="mono">&#8230;but we&#39;re cool right?</span>
      </div>
      <p class="lede">Whatever you were looking for isn&#39;t here. It may never have been. The rest of us are in the Discord.</p>
      <div class="cta-row">
        <a class="btn btn-primary btn-lg" href="./">Back to the site</a>
        <a class="btn btn-ghost btn-lg" href="https://discord.gg/YyyPNe7eGt">Join the Discord</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
